# Hero products ship as final CAD, inserted in post. The world registers the
# CAD as external truth — it never stores the model itself. Replace the paths
# and set current/approved when real exports land.

amara-ref:
  kind: image
  source: midjourney
  url: https://cdn.midjourney.com/54b0b750-ad9a-455b-9e66-d743ea40047d/0_1.png
  current: v1
  approved: true
  note: "Approved character reference — run 003 pick (top row, second
    frame): braided ponytail, watch on LEFT wrist. KNOWN FLAW: brow mark
    reads tattoo-like, not the canon healed scar — supersede with v2 when
    a scar-correct frame appears (approve refs against the canon
    checklist feature by feature, not by overall favorite). Rides along
    as --oref / --cref. CDN link may expire; mirror to
    ../refs/amara_ref_v1.png when convenient."

